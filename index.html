<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f4;--card:#fff;--ink:#17231f;--mut:#667570;--line:#e2e6e1;--acc:#0f766e;--hi:#f59e0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1715;--card:#17211e;--ink:#e8efec;--mut:#8da099;--line:#26332f;--acc:#2dd4bf;--hi:#fbbf24}}
:root[data-theme="dark"]{--bg:#0f1715;--card:#17211e;--ink:#e8efec;--mut:#8da099;--line:#26332f;--acc:#2dd4bf;--hi:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 20px 4px;max-width:1200px;margin:auto}h1{margin:0;font-size:22px}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
main{max-width:1200px;margin:auto;padding:12px 20px 32px;display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.kpi{grid-column:span 3}.kpi small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}.kpi b{display:block;font-size:26px;margin-top:2px}.kpi span{font-size:12px;color:var(--mut)}
.map{grid-column:span 7}.side{grid-column:span 5;display:flex;flex-direction:column;gap:14px}.tbl{grid-column:span 12}
h2{font-size:14px;margin:0 0 10px}
svg.m{width:100%;height:auto;max-height:560px;display:block}
.blk{fill:var(--acc);fill-opacity:.28;stroke:var(--acc);stroke-width:1.2;cursor:pointer;transition:fill-opacity .15s}
.blk:hover{fill-opacity:.55}.blk.sel{fill:var(--hi);fill-opacity:.6;stroke:var(--hi);stroke-width:2}
.lbl{font-size:13px;fill:var(--ink);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:var(--card);stroke-width:3px;font-weight:600}
.bar{display:grid;grid-template-columns:90px 1fr 64px;gap:8px;align-items:center;font-size:13px;padding:3px 0;cursor:pointer}
.bar i{display:block;height:14px;border-radius:4px;background:var(--acc);opacity:.7}.bar.sel i{background:var(--hi);opacity:1}.bar em{font-style:normal;color:var(--mut);text-align:right}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}dt{color:var(--mut)}dd{margin:0;text-align:right}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mut);cursor:pointer;font-weight:600}tr.sel td{background:color-mix(in srgb,var(--hi) 18%,transparent)}tbody tr{cursor:pointer}
@media(max-width:800px){.kpi{grid-column:span 6}.map,.side{grid-column:span 12}}
</style></head><body>
